services:
  kafka-doctor:
    image: apache/kafka:latest
    container_name: kafka-doctor
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - my_bridge
    extra_hosts:
      - "host.docker.internal:192.168.0.100"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka-doctor:29092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  kafka-ui-doctor:
    container_name: kafka-ui-doctor
    image: provectuslabs/kafka-ui:latest
    ports:
      - "82:8080"
    networks:
      - my_bridge
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-doctor:29092
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      - kafka-doctor
  triton:
    build:
      context: .
      dockerfile: triton.Dockerfile
    container_name: medical-triton
    ports:
      - "8000:8000" # HTTP
      - "8001:8001" # gRPC (Go Gateway 連接這個)
      - "8002:8002"
    volumes:
      - ./ai_model_repo:/models
    command: [ "tritonserver", "--model-repository=/models" ]
    environment:
      - TRANSFORMERS_OFFLINE=1      # 禁止 HuggingFace 嘗試連網
      - HF_DATASETS_OFFLINE=1
    networks:
      - my_bridge

networks:
  my_bridge:
    driver: bridge